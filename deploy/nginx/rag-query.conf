# Include inside the Bunpou server block.
# Server path: /www/server/panel/vhost/nginx/extension/bunpouService/rag-query.conf
# The RAG endpoint belongs to Bunpou's Node service.
location = /api/rag-query {
    proxy_pass http://127.0.0.1:3000/api/rag-query;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
