name: Restore and verify Bunpou assistant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Restore model and RAG routing
        env:
          RAG_SSH_HOST: ${{ secrets.SERVER_IP }}
          RAG_SSH_USER: ${{ secrets.SSH_USER }}
          RAG_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          rag_ssh_key=$(mktemp)
          rag_remote_script=$(mktemp)
          rag_known_hosts=$(mktemp)
          trap 'rm -f "$rag_ssh_key" "$rag_remote_script" "$rag_known_hosts"' EXIT
          printf '%s\n' "$RAG_SSH_KEY" | tr -d '\r' > "$rag_ssh_key"
          chmod 600 "$rag_ssh_key"
          cat > "$rag_remote_script" <<'RAG_REMOTE_SCRIPT'
          source ~/.bashrc >/dev/null 2>&1 || true
          python3.11 - <<'PY'
          import ast
          import json
          import pathlib
          import sqlite3
          import numpy as np
          from sentence_transformers import SentenceTransformer

          directory = pathlib.Path("/www/wwwroot/bunpouService/rag")
          server = (directory / "rag_server.py").read_text()
          tree = ast.parse(server)
          names = {"_reload_cache", "_retrieve", "_build_context", "_build_sources", "query", "reload_cache", "health"}
          functions = {node.name: ast.get_source_segment(server, node) for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names}
          prompt = next((ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "SYSTEM_PROMPT" for t in n.targets)), "")
          connection = sqlite3.connect("file:" + str(directory / "bunpou_rag.db") + "?mode=ro", uri=True)
          connection.row_factory = sqlite3.Row
          rows = [dict(row) for row in connection.execute("SELECT id,title,level,content,clean_text,embedding FROM grammar_docs")]
          connection.close()
          canonical = lambda key: key.removeprefix("docs/").removeprefix("bunpou/")
          targets = [r for r in rows if canonical(r["id"]) in ("N3/1-11-2", "N2/N2-87")]
          snapshot = {
              "functions": functions,
              "system_prompt": prompt,
              "build_index_source": (directory / "build_index.py").read_text(),
              "row_count": len(rows),
              "canonical_document_count": len({canonical(r["id"]) for r in rows}),
              "targets": [{k:v for k,v in r.items() if k != "embedding"} for r in targets],
          }
          model = SentenceTransformer(str(directory / "models/paraphrase-multilingual-MiniLM-L12-v2"))
          questions = ["如果我想翻译：这件衣服比另一件好看。要怎么翻译？用什么语法？", "比较 N1はN2より N1のほうがN2より 比……更……", "「こともあって」表示什么？"]
          vectors = model.encode(questions)
          matrix = np.array([json.loads(row["embedding"]) for row in rows], dtype=np.float32)
          matrix /= np.maximum(np.linalg.norm(matrix, axis=1, keepdims=True), 1e-9)
          rankings = []
          for question, vector in zip(questions, vectors):
              scores = matrix @ (vector / max(np.linalg.norm(vector), 1e-9))
              order = np.argsort(-scores)
              entries = [{"id": rows[i]["id"], "title": rows[i]["title"], "score": round(float(scores[i]), 4)} for i in order[:10]]
              target_ranks = {r["id"]: int(np.flatnonzero(order == i)[0]) + 1 for i,r in enumerate(rows) if canonical(r["id"]) in ("N3/1-11-2", "N2/N2-87")}
              rankings.append({"question":question,"top":entries,"target_ranks":target_ranks})
          snapshot["rankings"] = rankings
          payload = json.dumps(snapshot, ensure_ascii=False).encode().hex()
          assert "sk-" not in json.dumps(snapshot)
          print("RAG_SNAPSHOT_HEX " + payload)
          PY
          RAG_REMOTE_SCRIPT
          timeout 600 ssh -T -i "$rag_ssh_key" -o BatchMode=yes -o ConnectionAttempts=2 -o ConnectTimeout=20 -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$rag_known_hosts" "$RAG_SSH_USER@$RAG_SSH_HOST" 'bash -s' < "$rag_remote_script"
